<!DOCTYPE html>
<html>
<head>
    <title>Сайт Андрія</title>

    <style>
        body {
            background-color: #e6f2ff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            background-color: white;
            width: 500px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px gray;
        }

        h1 {
            color: #0066cc;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Привіт! 👋</h1>

        <p>Мене звати Андрій.</p>

        <p>Я вивчаю Linux, Python та веброзробку.</p>

        <h2>Мої цілі</h2>

        <ul>
            <li>Створювати сайти</li>
            <li>Писати Telegram-ботів</li>
            <li>Вивчати штучний інтелект</li>
        </ul>
    </div>
    <img src="https://picsum.photos/300 alt="Фото">
    <a href="https://github.com">Мій GitHub</a>

    <h3>Калькулятор</h2>

    <input type="number" id="num1" placeholder="Перше число">
    <input type="number" id="num2" placeholder="Друге число">

    <button onclick="calculate()">
        Додати
    </button>

    <p id="result"></p>
    <button onclick="sayHello()">
        Натисни на мене
    </button>

    <script>
    function sayHello() {
        alert("Привіт, Ніка!");
    }
   
    function calculate() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);
        
        document.getElementById("result").innerText =
            "Сума: " + (a + b);
    }
    </script>
</body>
</html>
